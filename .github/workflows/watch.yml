name: watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      min_seats:
        description: "Seats needed to count as open (0 sends a test alert for every slot)"
        default: "1"

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Remembers which slots were already announced, so an open slot pings once, not every run.
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python watch.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_SECONDS: "270"
          MIN_SEATS: ${{ inputs.min_seats || '1' }}
      # A test run marks every slot as announced, so it must not save that state.
      - uses: actions/cache/save@v4
        if: always() && (inputs.min_seats || '1') == '1'
        with:
          path: state.json
          key: state-${{ github.run_id }}
